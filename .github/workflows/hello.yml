name: Hello World CI
on : 
  push:
    branches:
      - main
jobs:
  my_self-hosted_job:
    name: my self hosted job
    runs-on: self-hosted
    steps:
      - name: steps in a self-hosted runner
        id: selfHostedId
        shell: cmd
        run: |
          echo this is a multi-line comment
          echo and this job has been executed from my self-hosted runner
  greet:
    runs-on: ubuntu-latest
    steps:
    - name: Say Hello
      run: echo "Hello World!"
    - name: List files
      run: ls -la
      
    
