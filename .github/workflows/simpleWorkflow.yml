name: workflow overview

on:
  workflow_dispatch:
jobs:
  a_sample_job:
    name: first job
    runs-on: ubuntu-latest
    steps:
      - name: step 1
        id: stepId
        run: echo "this is the first step from the first job"
      - name: step 2
        id: shellStep
        shell: python
        run: print(" this step is using python shell")
