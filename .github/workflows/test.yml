name: Example Workflow

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # SYNTAX 1: 'name' + 'uses' + 'with' (Checkout with options)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      # SYNTAX 2: 'name' + 'run' (Simple command)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      # SYNTAX 3: 'name' + 'run' (Multi-line script)
      - name: Build application
        run: |
          npm ci
          npm run build
          echo "BUILD_DIR=./dist" >> $GITHUB_ENV
      
      # SYNTAX 4: 'name' + 'uses' + 'with' + 'id' (Action with output reference)
      - name: Build Docker image
        id: docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: myapp:latest
